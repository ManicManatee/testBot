[Application]
name=Evony Bot
version=1.0.0
script=gui.py
publisher=EvonyBot

[Python]
version=3.11.9
bitness=64

[Include]
; Windows wheels downloaded from PyPI for the target platform
pypi_wheels=
    opencv-python==4.9.0.80
    Pillow==10.3.0
    numpy==1.26.4
    PyYAML==6.0.1
    pytesseract==0.3.10
    customtkinter==5.2.2
    darkdetect==0.8.0

; Local source files bundled into the installer
files=
    bot/
    main.py
    capture_templates.py
    config.yaml
    templates/

[Build]
installer_name=EvonyBot_Setup_v1.0.0.exe
